exp_dir: /data/lhy_data/rg/results_mimic_cxr_visual_grounded
dataset_dir: /data/lhy_data/rg
ckpt_zoo_dir: /data/lhy_data/rg/checkpoints
seed: 9223
trial: 9223
devices: 1
num_nodes: 1
num_workers: 6
strategy: 'auto'

module: cvt2distilgpt2_mimic_cxr_visual_grounded
definition: CvT2DistilGPT2MIMICXRVisualGrounded

# Keep the first visual-grounding experiment on supervised CE.
train_mode: 'ce'
encoder_lr: 5e-5
decoder_lr: 5e-4
mbatch_size: 4
prefetch_factor: 5
every_n_epochs: 1

monitor: 'val_chen_cider'
monitor_mode: 'max'
precision: 16
decoder_max_len: 128
num_test_beams: 4
max_epochs: 20

# Visual dependence losses.
# L = CE + w_null*L_null + w_mismatch*L_mismatch
#       + w_inv*L_nonclinical + w_concept*L_concept
null_margin_weight: 0.20
mismatch_margin_weight: 0.20
visual_margin: 0.20
nonclinical_invariance_weight: 0.01
concept_aux_weight: 0.10
concept_head_dropout: 0.10
detach_mismatch_features: true

# "valid" falls back to all non-padding target tokens when the built-in
# clinical lexicon finds no phrase. Change to "none" for strict phrase-only loss.
grounding_mask_fallback: 'none'
log_grounding_diagnostics: true

# These only address exact lexical loops; semantic duplication needs the later
# claim-planner/RadGraph stage.
generation_no_repeat_ngram_size: 3
generation_repetition_penalty: 1.10
generation_length_penalty: 1.0

enable_progress_bar: true
weights_summary: 'full'
early_stopping: true
patience: 5
min_delta: 1e-4
deterministic: false

# Example:
# CUDA_VISIBLE_DEVICES=2 dlhpcstarter -t mimic_cxr_visual_grounded \
#   -c config/train_mimic_cxr_visual_grounded.yaml \
#   --stages_module stages_visual_grounded --train
# CUDA_VISIBLE_DEVICES=2 dlhpcstarter -t mimic_cxr_visual_grounded -c config/train_mimic_cxr_visual_grounded.yaml --stages_module stages_visual_grounded --train --trial 9223
